<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Insert Employee Detail</title>
<link rel="stylesheet" type="text/css" href="./style1.css">
</head>
<body>
	
	<div class="main">
		<form action="sign">
			<h1>Emplolyee Sign-In</h1>
			<label>Enter Employee Name : </label>
			<input type="text" name="name"><br>
			
			<label>Enter  Employee Company Name : </label>
			<input type="text" name="cname"><br>
			
			<label>Enter Employee job : </label>
			<input type="text" name="job"><br>
			
			<label>Enter Employee salary : </label>
			<input type="number" name="sal"><br>
			
			<label>Enter Employee Email-id : </label>
			<input type="email" name="mail"><br>
			
			<label>Enter Employee Password : </label>
			<input type="password" name="pass"><br>
			
			<label>Enter Employee Phone Number : </label>
			<input type="tel" name="num"><br>
			
			<input type="submit" value="submit"><br>

		<a href="./empDetails.html">Employee Details ?</a>

		</form>

	</div>
	
</body>
</html>
