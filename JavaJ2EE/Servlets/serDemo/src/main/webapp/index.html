<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./style.css">
    <title>Login</title>
</head>
<body>
    <article>
    <div class="mainContainer">
        <h1 class="head">Welcome back<i class="fa-brands fa-canadian-maple-leaf"></i></h1>
        <p class="head">Please Enter Your Details</p>
        <button class="btn"><a href="#"><i class="fa-brands fa-google"></i>Login With Google</a></button><br>
        <button class="btn"><a href="#"><i class="fa-brands fa-apple"></i>Login With Apple</a></button>
        <hr>
        <form action="form">
            <label for="mail">Email :</label><br>
            <input class="btn inp fa-solid fa-lock" type="email" name="mail" id="mail" placeholder="Your Email" ><br>
            <label for="pass">Password:</label><br>
            <input class="btn inp fa-solid fa-lock" type="password" name="passwd" id="pass" placeholder="Your Password"><br>
            <input class="btn" type="submit" value="Login">
        </form>
        <a href="#">Did you forgot your password?</a><a href="#">Reset Password</a><br>
        <a class="cacc" href="#">Create Account</a>
    </div>
    </article>
</body>
</html>
