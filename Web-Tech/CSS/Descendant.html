<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descendant Selector</title>
    <link rel="stylesheet" href="./Desc.CSS">
</head>
<body>
    <!-- Combinator selector -->
    <!-- Descendant Selector -->
    <p>hello</p>
    <div>
        <!-- Child Selector -->
        <p>P1</p>
        <p>p2</p>
        <section>
           <nav>
            <main>
                <footer>
                    <p>p4</p>
                    <p>p5</p>
                </footer>
            </main>
        </nav>
        </section>
        <p>p3</p>
    </div>
    <!-- adjustaant sibling Selector -->
    <!-- General sibling Selector -->
    <p>p1</p>
    <p>p2</p>
    <p>p3</p>
    <p>p4</p>
</body>
</html>
