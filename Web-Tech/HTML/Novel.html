<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Service Login</title>
</head>
<body>
    <table>
        <tr>
            <td><label for="Uname">User Name:</label></td>
            <td><input type="text" name="Uname" id="Uname"></td>
        </tr>
        <tr>
            <td><label for="Pswd"></label>Password:</td>
            <td><input type="text" name="pswd" id="pswd"></td>
        </tr>
        <tr>
            <td><label for="COE">City of <br> Employment:</label></td>
            <td><input type="text" name="COE" id="COE"></td>
        </tr>
        <tr>
            <td><label for="WebS">Web Server:</label></td>
            <td><select name="WebS" id="WebS">
                <option value="-Choose a Server-">-Choose a Server-</option>
                <option value="Server-i">Server-i</option>
                <option value="Server-ii">Server-ii</option>
            </select></td>
        </tr>
        <tr>
            <td><label for="role">PleaseSpecify<br>Your Role</label></td>
            <td><input type="radio" name="Admin" id="role">Admin <br>
                <input type="radio" name="Engineer" id="role">Engineer <br>
                <input type="radio" name="Manager" id="role">Manager <br>
                <input type="radio" name="Guest" id="role">guest <br> </td>
        </tr> 
        <tr>
            <td><br><label for="Sign">Single Sign-on <br>to the following</label></td>
            <td><input type="checkbox" name="Mail" id="Sign">Mail <br>
                <input type="checkbox" name="PayRoll" id="Sign">PayRoll <br>
                <input type="checkbox" name="Self-Service" id="Sign">Self-Service <br>
            </td>
        </tr>
        <tr>
            <td colspan="2"><center><input type="button" value="Reset">
                <input type="button" value="Login"></center></td>
        </tr>
    </table>
</body>
</html>
