<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get">
        <fieldset>
            <legend>Registration Form</legend>
        <table>
            <tr>
                <td><label for="name">FULL NAME : </label></td>
                <td><input type="text" name="name" id="name"></td> 
            </tr>
            <tr>
                <td><label for="degree">DEGREEM : </label></td>
                <td><select name="degree" id="degree">
                        <option value="B.sc" id="degree">B.sc</option>
                        <option value="BCA" id="degree">BCA</option>
                        <option value="B.E" id="degree">B.E</option>
                        <option value="B.Tech" id="degree">B.Tech</option>
                        <option value="M.sc">M.sc</option>
                        <option value="M.Tech">M.Tech</option>
                        <option value="M.E">M.E</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="yop">Y.O.P</label></td>
                <td><input type="text" list="years" name="yop" id="yop">
                    <datalist id="years">
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                        <option value="2018">2018</option>
                        <option value="2017">2017</option>
                        <option value="2016">2016</option>
                    </datalist>
                </td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="submit"></td>
            </tr>
        </table>
    </fieldset>
    </form>
</body>
</html>
