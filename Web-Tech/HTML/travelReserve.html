<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation</title>
</head>
<body>
    <form action="">
        <caption><h1>Travel Reservation Form</h1></caption>
        <p><h4>*denotes mandstory</h4></p><br>
        <label for="name">Full Name* : </label><br>
        <input type="text" name="name" id="name" placeholder="First name Last Name" required autofocus><br>
        <label for="mail">E-Mail* :</label><br>
        <input type="email" name="mail" id="mail" placeholder="EMAIL_ADDRESS" required><br>
        <label for="package">Select Tour Package* :</label><br>
        <select name="package" id="packaeg" required><br>
            <option value="Goa">Goa</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Agra">Agra</option>
        </select><br>
        <label for="arrDate">Arrival Date*:</label><br>
        <input type="date" name="arrDate" id="arrDate"><br>
        <label for="NoPerson">Number Of Person* :</label><br>
        <input type="text" name="NoPerson" id="NoPerson" required placeholder="Unknown_Type"><br>
        <label for="Avail">What Would You Want to Avail ?*</label><br>
        Boarding<input type="checkbox" name="Boarding" id="Avail"><br>
        Fooding<input type="checkbox" name="Fooding" id="Avail"><br>
        Sight Seeing<input type="checkbox" name="Sight Seeing" id="Avail"><br>
        <label for="Couponcode">Discount Coupon Code:</label><br>
        <input type="text" name="Couponcode" id="Couponcode" placeholder="Unknown_Type"><br>
        <label for="conditions" aria-required="true">Terms And COnditions*:</label><br>
        <input type="radio" name="Agree" id="conditions">I aggre <br>
        <input type="radio" name="disAgree" id="conditions">I disaggre <br><br>
        <button id="Complete">Complete Reservation </button>
    </form>
</body>
</html>
